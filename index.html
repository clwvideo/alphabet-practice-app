<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Say the Letter">
<title>Say the Letter</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233A86FF'/%3E%3Ctext x='50' y='68' font-size='50' font-family='Arial,Helvetica,sans-serif' font-weight='900' fill='white' text-anchor='middle'%3EAa%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 90px 20px 150px;
    box-sizing: border-box;
    transition: background-color 0.25s ease;
  }
  #letterRow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  #letter {
    font-size: clamp(90px, 42vh, 260px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.25);
    transform: scale(1);
    transition: transform 0.12s ease;
    line-height: 1;
  }
  #letter.pulse {
    transform: scale(1.08);
  }
  #imageHint {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: rgba(0,0,0,0.2);
    border-radius: 20px;
    padding: 14px 20px;
    backdrop-filter: blur(4px);
  }
  #imageHint.shown { display: flex; }
  #hintEmoji {
    font-size: clamp(44px, 13vh, 90px);
    line-height: 1;
  }
  #hintWord {
    color: #fff;
    font-weight: 800;
    font-size: clamp(15px, 3vh, 22px);
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  #hint {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 12px) + 70px);
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    z-index: 20;
  }
  #gear {
    position: fixed;
    top: calc(env(safe-area-inset-top, 12px) + 14px);
    right: calc(env(safe-area-inset-right, 12px) + 14px);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    z-index: 20;
    backdrop-filter: blur(4px);
  }
  #toolbar {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 12px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    z-index: 20;
  }
  .roundBtn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(4px);
    flex-shrink: 0;
  }
  #correctBtn { background: #06D6A0; }
  #incorrectBtn { background: #EF476F; }
  #imageBtn { font-size: 22px; }
  #finishBtn {
    height: 54px;
    padding: 0 22px;
    border-radius: 27px;
    background: rgba(255,255,255,0.92);
    color: #1c1c1e;
    font-size: 17px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 24px;
  }
  .overlay.open { display: flex; }
  .panel {
    background: #1c1c1e;
    border-radius: 24px;
    padding: 28px 24px 24px;
    width: 100%;
    max-width: 340px;
    max-height: 80vh;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .panel h2 {
    color: #fff;
    font-size: 20px;
    margin: 0 0 4px;
  }
  .panel p {
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    margin: 0 0 20px;
  }
  #modeGrid {
    margin-bottom: 22px;
  }
  .modeBtn {
    padding: 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    border: 2px solid transparent;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .modeBtn.selected {
    background: #FF5A5F;
    border-color: #fff;
  }
  .pillBtn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    background: #FF5A5F;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  #statChips {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
  }
  .statChip {
    flex: 1;
    border-radius: 16px;
    padding: 14px 8px;
    color: #fff;
  }
  .statChip.correctChip { background: rgba(6,214,160,0.18); }
  .statChip.incorrectChip { background: rgba(239,71,111,0.18); }
  .statChip .statNum {
    display: block;
    font-size: 32px;
    font-weight: 900;
    line-height: 1.1;
  }
  .statChip .statLabel {
    display: block;
    font-size: 13px;
    font-weight: 600;
    opacity: 0.8;
  }
  #summaryList {
    text-align: left;
  }
  #summaryList .summarySubhead {
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  #summaryList ul {
    list-style: none;
    margin: 0 0 20px;
    padding: 0;
  }
  #summaryList li {
    background: rgba(239,71,111,0.15);
    color: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 16px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="letterRow">
      <div id="letter">A</div>
      <div id="imageHint">
        <div id="hintEmoji">🍎</div>
        <div id="hintWord">Apple</div>
      </div>
    </div>
  </div>
  <div id="hint">Mark &#10003; or &#10007; after each letter</div>
  <div id="gear">⚙️</div>

  <div id="toolbar">
    <div id="correctBtn" class="roundBtn">✓</div>
    <div id="incorrectBtn" class="roundBtn">✗</div>
    <div id="finishBtn">Finish</div>
    <div id="imageBtn" class="roundBtn">🖼️</div>
  </div>

  <div id="settingsOverlay" class="overlay">
    <div class="panel">
      <h2>Letter Case</h2>
      <p>Choose which letters to practice</p>
      <div id="modeGrid">
        <div class="modeBtn" data-mode="upper">Uppercase (A, B, C…)</div>
        <div class="modeBtn" data-mode="lower">Lowercase (a, b, c…)</div>
        <div class="modeBtn" data-mode="mixed">Mixed</div>
      </div>
      <div id="doneBtn" class="pillBtn">Done</div>
    </div>
  </div>

  <div id="summaryOverlay" class="overlay">
    <div class="panel">
      <h2>Session Summary</h2>
      <div id="statChips">
        <div class="statChip correctChip">
          <span class="statNum" id="correctCountEl">0</span>
          <span class="statLabel">Correct</span>
        </div>
        <div class="statChip incorrectChip">
          <span class="statNum" id="incorrectCountEl">0</span>
          <span class="statLabel">Incorrect</span>
        </div>
      </div>
      <div id="summaryList"></div>
      <div id="restartBtn" class="pillBtn">Start New Session</div>
    </div>
  </div>

<script>
  const COLORS = ['#FF5A5F', '#3A86FF', '#06D6A0', '#FFB703', '#8338EC', '#FB5607', '#118AB2', '#EF476F'];
  const MODE_KEY = 'sayTheLetter.caseMode';
  const STATS_KEY = 'sayTheLetter.stats';

  const LETTERS = [
    { letter: 'A', word: 'Apple', emoji: '🍎' },
    { letter: 'B', word: 'Bee', emoji: '🐝' },
    { letter: 'C', word: 'Cat', emoji: '🐱' },
    { letter: 'D', word: 'Dog', emoji: '🐶' },
    { letter: 'E', word: 'Elephant', emoji: '🐘' },
    { letter: 'F', word: 'Fish', emoji: '🐟' },
    { letter: 'G', word: 'Grapes', emoji: '🍇' },
    { letter: 'H', word: 'House', emoji: '🏠' },
    { letter: 'I', word: 'Ice Cream', emoji: '🍦' },
    { letter: 'J', word: 'Juice', emoji: '🧃' },
    { letter: 'K', word: 'Key', emoji: '🔑' },
    { letter: 'L', word: 'Lion', emoji: '🦁' },
    { letter: 'M', word: 'Moon', emoji: '🌙' },
    { letter: 'N', word: 'Nose', emoji: '👃' },
    { letter: 'O', word: 'Orange', emoji: '🍊' },
    { letter: 'P', word: 'Pig', emoji: '🐷' },
    { letter: 'Q', word: 'Queen', emoji: '👑' },
    { letter: 'R', word: 'Rainbow', emoji: '🌈' },
    { letter: 'S', word: 'Snake', emoji: '🐍' },
    { letter: 'T', word: 'Tree', emoji: '🌳' },
    { letter: 'U', word: 'Umbrella', emoji: '☂️' },
    { letter: 'V', word: 'Violin', emoji: '🎻' },
    { letter: 'W', word: 'Watermelon', emoji: '🍉' },
    { letter: 'X', word: 'Fox', emoji: '🦊' },
    { letter: 'Y', word: 'Yo-yo', emoji: '🪀' },
    { letter: 'Z', word: 'Zebra', emoji: '🦓' }
  ];

  const stage = document.getElementById('stage');
  const letterEl = document.getElementById('letter');
  const imageHint = document.getElementById('imageHint');
  const hintEmoji = document.getElementById('hintEmoji');
  const hintWord = document.getElementById('hintWord');
  const gear = document.getElementById('gear');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const modeGrid = document.getElementById('modeGrid');
  const doneBtn = document.getElementById('doneBtn');
  const correctBtn = document.getElementById('correctBtn');
  const incorrectBtn = document.getElementById('incorrectBtn');
  const finishBtn = document.getElementById('finishBtn');
  const imageBtn = document.getElementById('imageBtn');
  const summaryOverlay = document.getElementById('summaryOverlay');
  const correctCountEl = document.getElementById('correctCountEl');
  const incorrectCountEl = document.getElementById('incorrectCountEl');
  const summaryList = document.getElementById('summaryList');
  const restartBtn = document.getElementById('restartBtn');

  let caseMode = localStorage.getItem(MODE_KEY);
  if (!['upper', 'lower', 'mixed'].includes(caseMode)) caseMode = 'upper';

  let letterStats = {};
  try { letterStats = JSON.parse(localStorage.getItem(STATS_KEY)) || {}; } catch (e) { letterStats = {}; }

  let currentEntry = LETTERS[0];
  let currentChar = 'A';
  let lastChar = null;
  let correctCount = 0;
  let incorrectCount = 0;
  let incorrectList = [];

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function saveStats() {
    localStorage.setItem(STATS_KEY, JSON.stringify(letterStats));
  }

  function pickWeighted(caseToUse) {
    const candidates = LETTERS.map(entry => {
      const ch = caseToUse === 'lower' ? entry.letter.toLowerCase() : entry.letter;
      const stat = letterStats[ch] || { correct: 0, incorrect: 0 };
      const weight = Math.max(0.15, (1 + stat.incorrect * 3) / (1 + stat.correct * 0.4));
      return { entry, ch, weight };
    }).filter(c => c.ch !== lastChar || LETTERS.length === 1);

    const total = candidates.reduce((sum, c) => sum + c.weight, 0);
    let r = Math.random() * total;
    for (const c of candidates) {
      r -= c.weight;
      if (r <= 0) return c;
    }
    return candidates[candidates.length - 1];
  }

  function showNewLetter() {
    const caseToUse = caseMode === 'mixed' ? (Math.random() < 0.5 ? 'upper' : 'lower') : caseMode;
    const picked = pickWeighted(caseToUse);
    currentEntry = picked.entry;
    currentChar = picked.ch;
    lastChar = picked.ch;

    letterEl.textContent = currentChar;
    imageHint.classList.remove('shown');
    hintEmoji.textContent = currentEntry.emoji;
    hintWord.textContent = currentEntry.word;

    stage.style.backgroundColor = COLORS[randomInt(0, COLORS.length - 1)];
    letterEl.classList.remove('pulse');
    void letterEl.offsetWidth;
    letterEl.classList.add('pulse');
  }

  function speakHint() {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const name = currentEntry.letter;
    const utterance = new SpeechSynthesisUtterance(name + '. ' + name + ' for ' + currentEntry.word + '.');
    window.speechSynthesis.speak(utterance);
  }

  function buildModeGrid() {
    Array.from(modeGrid.children).forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.mode === caseMode);
    });
  }

  function recordResult(wasCorrect) {
    const stat = letterStats[currentChar] || { correct: 0, incorrect: 0 };
    if (wasCorrect) {
      stat.correct++;
      correctCount++;
    } else {
      stat.incorrect++;
      incorrectCount++;
      incorrectList.push(currentChar);
    }
    letterStats[currentChar] = stat;
    saveStats();
    showNewLetter();
  }

  function showSummary() {
    correctCountEl.textContent = correctCount;
    incorrectCountEl.textContent = incorrectCount;
    if (incorrectList.length) {
      summaryList.innerHTML = '<p class="summarySubhead">Letters read incorrectly:</p><ul>' +
        incorrectList.map(ch => '<li>' + ch + '</li>').join('') + '</ul>';
    } else if (correctCount + incorrectCount > 0) {
      summaryList.innerHTML = '<p class="summarySubhead">All letters were read correctly! 🎉</p>';
    } else {
      summaryList.innerHTML = '';
    }
    summaryOverlay.classList.add('open');
  }

  function resetSession() {
    correctCount = 0;
    incorrectCount = 0;
    incorrectList = [];
    showNewLetter();
  }

  stage.addEventListener('click', showNewLetter);

  gear.addEventListener('click', (e) => {
    e.stopPropagation();
    buildModeGrid();
    settingsOverlay.classList.add('open');
  });

  Array.from(modeGrid.children).forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      caseMode = btn.dataset.mode;
      localStorage.setItem(MODE_KEY, caseMode);
      buildModeGrid();
    });
  });

  doneBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsOverlay.classList.remove('open');
    showNewLetter();
  });

  settingsOverlay.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) settingsOverlay.classList.remove('open');
  });

  correctBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    recordResult(true);
  });

  incorrectBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    recordResult(false);
  });

  imageBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const nowShown = imageHint.classList.toggle('shown');
    if (nowShown) speakHint();
  });

  finishBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    showSummary();
  });

  restartBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    summaryOverlay.classList.remove('open');
    resetSession();
  });

  summaryOverlay.addEventListener('click', (e) => {
    if (e.target === summaryOverlay) summaryOverlay.classList.remove('open');
  });

  showNewLetter();
</script>
</body>
</html>
